name: image

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

# Ничего по умолчанию: права выдаются пожобно, ровно те, что нужны.
permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Ключ Soniox не нужен: e2e гоняет шим против заглушки их API.
      - name: End-to-end against the mock
        run: ./tests/e2e.sh

  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Провенанс подписывается через OIDC-токен раннера и публикуется как
      # attestation репозитория — оба права нужны шагу attest ниже.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Раннер по умолчанию даёт драйвер docker, а он не умеет экспортировать
      # кэш: без этого шага build-push-action падает на cache-to type=gha.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # metadata-action ставит latest только на semver-теги, а их пока нет,
          # поэтому :latest публикуется явно с master — на него ссылается deploy.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Подписанное утверждение о том, чем и из чего собран этот digest.
      # Проверка на стороне потребителя:
      #   gh attestation verify oci://ghcr.io/cosmdandy/soniox-openai-shim:<tag> --owner CosmDandy
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
