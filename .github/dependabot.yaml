# Пины по SHA не обновляются сами — этим занимается Dependabot: он поднимает PR
# с новым SHA и правит комментарий-версию рядом.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Пауза перед обновлением: большинство supply-chain атак на пакеты и экшены
    # выявляют в первые дни, поэтому свежие релизы не тянем сразу.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # Залоченные с хешами requirements.txt и digest базового образа тоже сами не
  # двигаются: без этих записей образ стареет, пока его не пересоберут руками.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
