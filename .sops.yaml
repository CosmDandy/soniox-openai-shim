# Конфиг sops: КОМУ можно читать секреты этого репозитория.
# Мнемоника: .sops.yaml — «кому можно читать», *.sops.yaml — «что читать».
#
# Зона одна — мак: шим слушает только 127.0.0.1 и поднимается с этой машины,
# ни в кластер, ни в CI репозиторий не попадает. Появится вторая зона —
# добавить её ключ сюда и выполнить `sops updatekeys secrets.sops.yaml`.

creation_rules:
  - path_regex: '[^/]+\.sops\.ya?ml$'
    age: age1r7w9d59dtx5ksqxfujskjk5xwrt4ftv5czva2zzff2paggggy9nq4q0lxm
